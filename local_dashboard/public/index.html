<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MuscleBoxPro Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f10;
      --surface: #18181b;
      --border: #27272a;
      --muted: #3f3f46;
      --text: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #71717a;
      --accent: #f97316;
      --accent-2: #db2777;
      --green: #22c55e;
      --red: #ef4444;
    }

    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Login ── */
    #login-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 340px; }
    .login-card .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .login-card .logo span { font-size: 16px; font-weight: 900; letter-spacing: 2px; color: var(--accent); }
    .login-card h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .login-card p { color: var(--text-2); margin-bottom: 24px; font-size: 13px; }
    .login-card input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; transition: border-color .2s; }
    .login-card input:focus { border-color: var(--accent); }
    .login-card button { width: 100%; margin-top: 14px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border: none; border-radius: 10px; padding: 11px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .2s; }
    .login-card button:hover { opacity: .9; }
    .login-error { color: var(--red); font-size: 12px; margin-top: 10px; display: none; }

    /* ── App shell ── */
    #app { display: none; flex-direction: column; height: 100vh; }

    /* Top bar */
    .topbar { height: 52px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 14px; flex-shrink: 0; }
    .topbar .logo { display: flex; align-items: center; gap: 8px; }
    .topbar .logo span { font-size: 14px; font-weight: 900; letter-spacing: 2px; color: var(--accent); }
    .topbar .divider { width: 1px; height: 18px; background: var(--border); }
    .topbar .tag { font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .topbar .spacer { flex: 1; }
    .topbar .signout-btn { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--text-2); font-size: 12px; padding: 5px 12px; cursor: pointer; transition: all .2s; }
    .topbar .signout-btn:hover { border-color: var(--muted); color: var(--text); }

    /* Main layout */
    .main { display: flex; flex: 1; min-height: 0; }

    /* Sidebar */
    .sidebar { width: 52px; border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; flex-shrink: 0; }
    .sidebar-btn { width: 38px; height: 38px; border-radius: 10px; border: none; background: none; color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; }
    .sidebar-btn:hover { background: var(--surface); color: var(--text-2); }
    .sidebar-btn.active { background: rgba(249,115,22,.15); color: var(--accent); }
    .sidebar-btn svg { width: 18px; height: 18px; }

    /* Content panels */
    .panel { flex: 1; display: none; flex-direction: column; min-width: 0; min-height: 0; }
    .panel.active { display: flex; }
    .panel-header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .panel-header h2 { font-size: 13px; font-weight: 600; }
    .panel-header .icon { color: var(--accent); }

    /* ── Inbox ── */
    .inbox-layout { display: flex; flex: 1; min-height: 0; }

    /* Email list */
    .email-list { width: 300px; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .email-list-toolbar { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
    .email-list-toolbar input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--text); font-size: 13px; outline: none; }
    .email-list-toolbar input:focus { border-color: var(--accent); }
    .refresh-btn { background: none; border: 1px solid var(--border); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; color: var(--text-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s; }
    .refresh-btn:hover { border-color: var(--muted); color: var(--text); }
    .refresh-btn svg { width: 14px; height: 14px; }
    .refresh-btn.spinning svg { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .email-items { flex: 1; overflow-y: auto; }
    .email-item { padding: 12px 12px 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; display: flex; gap: 10px; border-left: 3px solid transparent; }
    .email-item:hover { background: var(--surface); border-left-color: var(--muted); }
    .email-item.selected { background: rgba(249,115,22,.12); border-left-color: var(--accent); }
    .email-item.selected .email-sender { color: #fff; }
    .email-item.selected .email-subject { color: var(--text); }
    .email-avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .email-meta { flex: 1; min-width: 0; }
    .email-meta-row { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
    .email-sender { font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .email-sender.unread { color: #fff; }
    .email-date { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
    .email-subject { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .email-preview { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 4px; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-3); gap: 10px; }
    .empty-state svg { width: 40px; height: 40px; opacity: .4; }

    /* Email viewer */
    .email-viewer { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .email-viewer-header { padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .email-viewer-header h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    .email-from-row { display: flex; align-items: center; gap: 10px; }
    .viewer-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .viewer-from-info { flex: 1; }
    .viewer-from-name { font-size: 13px; font-weight: 600; }
    .viewer-from-email { font-size: 11px; color: var(--text-3); }
    .viewer-date { font-size: 11px; color: var(--text-3); }
    .viewer-recipients { margin-top: 10px; display: flex; flex-direction: column; gap: 3px; }
    .viewer-recipient-row { display: flex; gap: 8px; font-size: 12px; }
    .viewer-recipient-label { color: var(--text-3); width: 28px; flex-shrink: 0; }
    .viewer-recipient-value { color: var(--text-2); }
    .reply-btn { background: linear-gradient(90deg, var(--accent-2), var(--accent)); border: none; border-radius: 8px; color: #fff; padding: 7px 16px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: opacity .2s; }
    .reply-btn:hover { opacity: .85; }

    .email-body-area { flex: 1; overflow-y: auto; padding: 20px; }
    .email-body-area iframe { width: 100%; min-height: 400px; border: none; background: #fff; border-radius: 10px; }
    .email-body-text { font-size: 13px; line-height: 1.8; color: var(--text-2); white-space: pre-wrap; }

    .viewer-actions { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; }

    /* Split view */
    .email-split-top { flex: 0 0 42%; overflow-y: auto; border-bottom: 2px solid var(--border); display: flex; flex-direction: column; }
    .email-split-bottom { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    /* Reply composer */
    .reply-composer { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .reply-composer-header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .reply-composer-header span { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; color: var(--accent); }
    .back-btn { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--text-2); font-size: 12px; padding: 5px 12px; cursor: pointer; transition: all .2s; }
    .back-btn:hover { border-color: var(--muted); color: var(--text); }

    /* Mode toggle */
    .mode-toggle { display: flex; gap: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
    .mode-btn { background: none; border: none; border-radius: 6px; padding: 5px 14px; font-size: 12px; font-weight: 600; color: var(--text-3); cursor: pointer; transition: all .2s; }
    .mode-btn.active { background: var(--surface); color: var(--text); }

    .reply-form { flex: 1; display: flex; flex-direction: column; padding: 16px 20px; gap: 12px; overflow-y: auto; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; }
    .form-group input, .form-group textarea, .form-group select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 13px; outline: none; font-family: inherit; transition: border-color .2s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 200px; line-height: 1.7; }
    .form-group select { cursor: pointer; }
    .form-group select option { background: var(--surface); }

    /* Template fields */
    .tpl-fields { display: flex; flex-direction: column; gap: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .tpl-fields-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
    .tpl-field { display: flex; flex-direction: column; gap: 3px; }
    .tpl-field label { font-size: 11px; color: var(--text-3); }
    .tpl-field input, .tpl-field textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; color: var(--text); font-size: 13px; outline: none; font-family: inherit; transition: border-color .2s; }
    .tpl-toolbar { display: flex; gap: 4px; margin-bottom: 2px; }
    .tpl-fmt-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--text-2); font-size: 12px; font-weight: 700; width: 26px; height: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; font-family: Georgia, serif; }
    .tpl-fmt-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tpl-field input:focus, .tpl-field textarea:focus { border-color: var(--accent); }
    .tpl-field textarea { resize: vertical; min-height: 200px; line-height: 1.6; }
    .tpl-hint { font-size: 11px; color: var(--text-3); font-style: italic; }

    .reply-footer { padding: 14px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .send-btn { width: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border: none; border-radius: 10px; padding: 11px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .send-btn:hover { opacity: .9; }
    .send-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Database panel ── */
    .db-layout { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .db-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 20px; flex-shrink: 0; }
    .db-tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-3); font-size: 13px; font-weight: 600; padding: 12px 16px; cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 6px; margin-bottom: -1px; }
    .db-tab:hover { color: var(--text-2); }
    .db-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .db-tab .tab-count { background: var(--muted); color: var(--text-3); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; }
    .db-tab.active .tab-count { background: rgba(249,115,22,.2); color: var(--accent); }

    .db-panel { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .db-panel.active { display: flex; }

    /* Overview */
    .overview-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; cursor: pointer; transition: border-color .2s; }
    .stat-card:hover { border-color: var(--accent); }
    .stat-card-label { display: flex; align-items: center; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-3); margin-bottom: 8px; }
    .stat-card-label svg { width: 14px; height: 14px; }
    .stat-card-value { font-size: 36px; font-weight: 900; }
    .stat-card-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; }

    /* Table view */
    .table-toolbar { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .table-toolbar input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; color: var(--text); font-size: 13px; outline: none; }
    .table-toolbar input:focus { border-color: var(--accent); }
    .table-toolbar .row-count { font-size: 12px; color: var(--text-3); flex-shrink: 0; }

    .table-wrap { flex: 1; overflow: auto; }
    table.db-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.db-table th { position: sticky; top: 0; background: var(--surface); color: var(--text-3); font-size: 10px; text-transform: uppercase; letter-spacing: .8px; font-weight: 700; padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    table.db-table td { padding: 10px 16px; border-bottom: 1px solid rgba(39,39,42,.5); color: var(--text-2); vertical-align: top; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    table.db-table tr:last-child td { border-bottom: none; }
    table.db-table tr:hover td { background: rgba(249,115,22,.04); }
    table.db-table td.bold { color: var(--text); font-weight: 600; }
    table.db-table td.muted { color: var(--text-3); font-size: 11px; }
    table.db-table td.wrap { white-space: normal; word-break: break-word; }
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .badge-demo { background: rgba(249,115,22,.15); color: var(--accent); }
    .badge-campaign { background: rgba(219,39,119,.15); color: var(--accent-2); }

    /* Detail modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 440px; max-width: 95vw; }
    .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
    .modal-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .modal-label { width: 80px; font-size: 12px; color: var(--text-3); flex-shrink: 0; }
    .modal-value { font-size: 13px; color: var(--text); word-break: break-word; }
    .modal-close { width: 100%; margin-top: 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px; color: var(--text-2); font-size: 13px; cursor: pointer; transition: all .2s; }
    .modal-close:hover { border-color: var(--muted); color: var(--text); }

    /* Preview modal */
    .preview-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 150; }
    .preview-overlay.open { display: flex; }
    .preview-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: min(860px, 95vw); max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    .preview-modal-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .preview-modal-header span { font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
    .preview-modal-header span svg { color: var(--accent); }
    .preview-close { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--text-2); font-size: 12px; padding: 5px 14px; cursor: pointer; transition: all .2s; }
    .preview-close:hover { border-color: var(--muted); color: var(--text); }
    .preview-modal-body { flex: 1; overflow-y: auto; background: #f4f4f5; }
    .preview-modal-body iframe { width: 100%; min-height: 500px; border: none; display: block; }
    .preview-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text-2); font-size: 12px; font-weight: 600; padding: 6px 14px; cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center; margin-top: 4px; }
    .preview-btn:hover { border-color: var(--accent); color: var(--accent); }
    .preview-btn svg { width: 13px; height: 13px; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 13px; font-weight: 500; display: none; align-items: center; gap: 10px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    .toast.show { display: flex; }
    .toast.success { border-color: var(--green); }
    .toast.error { border-color: var(--red); }
    .toast .toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .toast.error .toast-dot { background: var(--red); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 4px; }

    /* Skeleton */
    .skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--muted) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Tunnel banner ── */
    .tunnel-banner { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); font-size: 12px; flex-shrink: 0; min-height: 36px; }
    .tunnel-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tunnel-dot-on { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,.5); }
    .tunnel-dot-off { background: var(--muted); }
    .tunnel-label { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-2); flex-shrink: 0; }
    .tunnel-url { font-family: monospace; font-size: 12px; color: #22c55e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .tunnel-copy-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-3); width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all .15s; }
    .tunnel-copy-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Machine Endpoints ── */
    .machine-layout { display: flex; flex: 1; min-height: 0; }

    .endpoint-list { width: 256px; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
    .endpoint-list-header { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-3); font-weight: 700; }
    .endpoint-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; border-left: 3px solid transparent; }
    .endpoint-item:hover { background: var(--surface); border-left-color: var(--muted); }
    .endpoint-item.ep-active { background: rgba(59,130,246,.1); border-left-color: #3b82f6; }
    .method-badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 5px; font-size: 10px; font-weight: 700; letter-spacing: .5px; margin-bottom: 4px; }
    .method-post { background: rgba(34,197,94,.15); color: #22c55e; }
    .endpoint-path { font-size: 12px; font-weight: 600; color: var(--text); font-family: monospace; }
    .endpoint-item.ep-active .endpoint-path { color: #60a5fa; }
    .endpoint-desc { font-size: 11px; color: var(--text-3); margin-top: 3px; line-height: 1.4; }

    .endpoint-detail { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
    .endpoint-url-bar { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; background: var(--surface); }
    .url-method-badge { background: rgba(34,197,94,.15); color: #22c55e; font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 7px; flex-shrink: 0; }
    .url-path-display { font-family: monospace; font-size: 13px; color: var(--text-2); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; flex: 1; }
    .send-endpoint-btn { background: linear-gradient(90deg, #2563eb, #3b82f6); border: none; border-radius: 8px; color: #fff; padding: 8px 20px; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity .2s; flex-shrink: 0; }
    .send-endpoint-btn:hover { opacity: .85; }
    .send-endpoint-btn:disabled { opacity: .5; cursor: not-allowed; }

    .endpoint-sections { display: flex; flex-direction: column; gap: 18px; padding: 18px 20px; overflow-y: auto; }
    .ep-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-3); font-weight: 700; margin-bottom: 10px; }

    .field-grid { display: flex; flex-direction: column; gap: 8px; }
    .field-row { display: grid; grid-template-columns: 180px 1fr; gap: 10px; align-items: start; }
    .field-label-wrap { display: flex; flex-direction: column; gap: 3px; padding-top: 8px; }
    .field-name { font-size: 12px; font-weight: 600; color: var(--text); font-family: monospace; }
    .field-badges { display: flex; gap: 4px; align-items: center; }
    .field-badge { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; }
    .field-required { background: rgba(239,68,68,.15); color: #ef4444; }
    .field-optional { background: rgba(113,113,122,.15); color: var(--text-3); }
    .field-type-tag { font-size: 10px; color: var(--text-3); }
    .field-input { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; color: var(--text); font-size: 12px; outline: none; font-family: monospace; transition: border-color .2s; width: 100%; }
    .field-input:focus { border-color: #3b82f6; }

    .response-area { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .response-header { padding: 9px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .response-status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-idle { background: var(--muted); }
    .dot-success { background: var(--green); }
    .dot-error { background: var(--red); }
    .response-status-text { font-size: 11px; font-weight: 600; color: var(--text-2); }
    .response-body { padding: 14px; font-family: monospace; font-size: 12px; color: #7dd3fc; line-height: 1.75; white-space: pre; overflow-x: auto; min-height: 80px; }
    .response-placeholder { color: var(--text-3); font-style: italic; font-family: inherit; }

    .qr-section { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); }
    .qr-canvas-wrap { background: #fff; padding: 10px; border-radius: 8px; }
    .qr-url-label { font-size: 10px; color: var(--text-3); text-align: center; word-break: break-all; max-width: 320px; font-family: monospace; }
    .action-buttons-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .action-btn { padding: 8px 16px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all .15s; }
    .action-btn:hover { background: rgba(59,130,246,.15); border-color: #3b82f6; color: #60a5fa; }
    .action-btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="8" fill="#f97316"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="white" font-weight="900" font-size="20">M</text></svg>
      <span>MUSCLEBOXPRO</span>
    </div>
    <h1>Admin Dashboard</h1>
    <p>Enter your password to continue</p>
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" />
    <button onclick="login()">Sign In</button>
    <div class="login-error" id="login-error">Wrong password. Try again.</div>
  </div>
</div>

<!-- App -->
<div id="app">

  <!-- Topbar -->
  <div class="topbar">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="8" fill="#f97316"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="white" font-weight="900" font-size="20">M</text></svg>
      <span>MUSCLEBOXPRO</span>
    </div>
    <div class="divider"></div>
    <span class="tag">Admin</span>
    <div class="spacer"></div>
    <button class="signout-btn" onclick="signOut()">Sign out</button>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Sidebar -->
    <nav class="sidebar">
      <button class="sidebar-btn active" id="nav-inbox" onclick="switchTab('inbox')" title="Inbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
      </button>
      <button class="sidebar-btn" id="nav-stats" onclick="switchTab('stats')" title="Database">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
      </button>
      <button class="sidebar-btn" id="nav-machine" onclick="switchTab('machine')" title="Machine Endpoints">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
      </button>
    </nav>

    <!-- Inbox panel -->
    <div class="panel active" id="panel-inbox">
      <div class="inbox-layout">

        <!-- Email list -->
        <div class="email-list">
          <div class="email-list-toolbar">
            <input type="text" id="search-input" placeholder="Search..." oninput="filterEmails()" />
            <button class="refresh-btn" id="refresh-btn" onclick="loadInbox()" title="Refresh">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
            </button>
          </div>
          <div class="email-items" id="email-items">
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
              <span>Loading inbox...</span>
            </div>
          </div>
        </div>

        <!-- Viewer area -->
        <div class="email-viewer" id="email-viewer">
          <div class="empty-state" style="height:100%">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>Select an email to read</span>
          </div>
        </div>

      </div>
    </div>

    <!-- Machine Endpoints panel -->
    <div class="panel" id="panel-machine">
      <div class="panel-header">
        <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        <h2>Machine Endpoints</h2>
      </div>
      <div class="tunnel-banner" id="tunnel-banner"></div>
      <div class="machine-layout">
        <div class="endpoint-list" id="endpoint-list"></div>
        <div class="endpoint-detail" id="endpoint-detail">
          <div class="empty-state" style="height:100%">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
            <span>Select an endpoint to test</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats panel -->
    <div class="panel" id="panel-stats">
      <div class="panel-header">
        <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        <h2>Database</h2>
      </div>
      <div class="db-layout" id="stats-content">
        <div class="empty-state" style="height:200px"><span>Loading...</span></div>
      </div>
    </div>

  </div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <h3 id="modal-title">Request Detail</h3>
    <div id="modal-body"></div>
    <button class="modal-close" onclick="closeModal()">Close</button>
  </div>
</div>

<!-- Preview modal -->
<div class="preview-overlay" id="preview-overlay" onclick="closePreview(event)">
  <div class="preview-modal">
    <div class="preview-modal-header">
      <span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Email Preview
      </span>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="send-btn" id="preview-send-btn" style="padding:7px 18px;font-size:13px;border-radius:8px;" onclick="sendReply()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send Reply
        </button>
        <button class="preview-close" onclick="closePreview()">Close</button>
      </div>
    </div>
    <div class="preview-modal-body">
      <iframe id="preview-iframe" sandbox="allow-same-origin"></iframe>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="toast-dot"></div>
  <span id="toast-msg"></span>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────

  let password = '';
  let allEmails = [];
  let selectedEmail = null;
  let replyMode = false;
  let replyComposerMode = 'basic'; // 'basic' | 'template'
  let selectedTemplate = 'simple'; // template key

  // ── Templates ─────────────────────────────────────────────────────────────

  const TEMPLATES = {
    region: {
      name: 'Region Not Operational',
      subject: (m) => `Re: ${m.subject.replace(/^Re:\s*/i, '')}`,
      fields: [
        { key: 'name',   label: 'Recipient Name',  type: 'input',    default: (m) => m.from.name || m.from.address.split('@')[0] },
        { key: 'region', label: 'Region / State',  type: 'input',    default: () => 'Andhra Pradesh' },
        { key: 'extra',  label: 'Additional note (optional)', type: 'textarea', default: () => '' },
      ],
      build: (f) =>
        `Hi ${f.name},\n\nThank you for your interest in MuscleBoxPro and for requesting a demo. We truly appreciate your enthusiasm for bringing a protein shake vending solution to your gym.\n\nAt present, our operations are focused on select regions, and we have not yet started operations in ${f.region}. However, we are actively evaluating expansion into new states in the future.\n\nThat said, if you are interested in setting up a protein shake vending machine independently, we can certainly assist you in procuring a suitable machine and guiding you on setup and operation. This arrangement would be managed directly by you and would not operate under the MuscleBoxPro brand.\n\nIf this option interests you, please let us know, and we can share further details regarding machine specifications, cost, and supplier options.${f.extra ? '\n\n' + f.extra : ''}\n\nWe sincerely appreciate your interest and hope to collaborate in some capacity.\n\nBest regards,\nMuscleBoxPro Team`,
    },
    simple: {
      name: 'Simple Message',
      subject: (m) => `Re: ${m.subject.replace(/^Re:\s*/i, '')}`,
      fields: [
        { key: 'name',    label: 'Recipient Name', type: 'input',    default: (m) => m.from.name || m.from.address.split('@')[0] },
        { key: 'message', label: 'Message Body',   type: 'textarea', default: () => '' },
      ],
      build: (f) => `Hi ${f.name},\n\n${f.message}\n\nBest regards,\nMuscleBoxPro Team`,
    },
    followup: {
      name: 'General Follow-up',
      subject: (m) => `Re: ${m.subject.replace(/^Re:\s*/i, '')}`,
      fields: [
        { key: 'name',    label: 'Recipient Name',    type: 'input',    default: (m) => m.from.name || m.from.address.split('@')[0] },
        { key: 'context', label: 'Context / Purpose', type: 'input',    default: () => 'your recent inquiry' },
        { key: 'action',  label: 'Next Action',       type: 'input',    default: () => 'schedule a call at your convenience' },
        { key: 'extra',   label: 'Additional details (optional)', type: 'textarea', default: () => '' },
      ],
      build: (f) =>
        `Hi ${f.name},\n\nThank you for reaching out regarding ${f.context}. We appreciate you taking the time to connect with us.\n\nWe would love to ${f.action}. Please let us know what works best for you.${f.extra ? '\n\n' + f.extra : ''}\n\nLooking forward to hearing from you.\n\nBest regards,\nMuscleBoxPro Team`,
    },
  };

  // ── Auth ───────────────────────────────────────────────────────────────────

  async function login() {
    const pwd = document.getElementById('password-input').value.trim();
    if (!pwd) return;
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd }),
    });
    if (res.ok) {
      password = pwd;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      loadInbox();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  }

  document.getElementById('password-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  function signOut() {
    password = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('password-input').value = '';
  }

  function api(path, options = {}) {
    return fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'x-dashboard-password': password,
        ...(options.headers || {}),
      },
    });
  }

  // ── Tabs ───────────────────────────────────────────────────────────────────

  function switchTab(tab) {
    ['inbox', 'stats', 'machine'].forEach(t => {
      document.getElementById(`panel-${t}`).classList.toggle('active', t === tab);
      document.getElementById(`nav-${t}`).classList.toggle('active', t === tab);
    });
    if (tab === 'stats') loadStats();
    if (tab === 'machine') initMachinePanel();
  }

  // ── Toast ──────────────────────────────────────────────────────────────────

  let toastTimer;
  function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.className = `toast show ${type}`;
    document.getElementById('toast-msg').textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  // ── Helpers ────────────────────────────────────────────────────────────────

  function initials(name, address) {
    return (name || address || '?').slice(0, 2).toUpperCase();
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const now = new Date();
    if (now - d < 86400000) return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  }

  function fmtDateLong(iso) {
    return new Date(iso).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
  }

  // ── Inbox ──────────────────────────────────────────────────────────────────

  async function loadInbox() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    try {
      const res = await api('/api/inbox');
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);
      allEmails = data.messages || [];
      renderEmailList(allEmails);
    } catch (err) {
      showToast(err.message || 'Failed to load inbox', 'error');
      document.getElementById('email-items').innerHTML = `<div class="empty-state"><span>Failed to load inbox</span></div>`;
    } finally {
      btn.classList.remove('spinning');
    }
  }

  function filterEmails() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = q
      ? allEmails.filter(m => {
          const addrList = [
            m.from.name, m.from.address,
            ...(m.to || []).flatMap(a => [a.name, a.address]),
            ...(m.cc || []).flatMap(a => [a.name, a.address]),
          ].join(' ').toLowerCase();
          return addrList.includes(q) || m.subject.toLowerCase().includes(q);
        })
      : allEmails;
    renderEmailList(filtered);
  }

  function renderEmailList(emails) {
    const el = document.getElementById('email-items');
    if (!emails.length) {
      el.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg><span>No emails found</span></div>`;
      return;
    }
    el.innerHTML = emails.map(m => `
      <div class="email-item ${selectedEmail?.uid === m.uid ? 'selected' : ''}" onclick="selectEmail(${m.uid})">
        <div class="email-avatar">${initials(m.from.name, m.from.address)}</div>
        <div class="email-meta">
          <div class="email-meta-row">
            <span class="email-sender ${m.seen ? '' : 'unread'}">${m.from.name || m.from.address}</span>
            <span class="email-date">${fmtDate(m.date)}</span>
          </div>
          <div class="email-subject">${m.subject}</div>
          <div class="email-preview">${(m.textBody || '').slice(0, 60)}</div>
        </div>
        ${!m.seen ? '<div class="unread-dot"></div>' : ''}
      </div>
    `).join('');
  }

  function selectEmail(uid) {
    selectedEmail = allEmails.find(m => m.uid === uid);
    replyMode = false;
    filterEmails();
    renderViewer();
  }

  function emailPaneHtml(m) {
    return `
      <div class="email-viewer-header">
        <h3>${m.subject}</h3>
        <div class="email-from-row">
          <div class="viewer-avatar">${initials(m.from.name, m.from.address)}</div>
          <div class="viewer-from-info">
            <div class="viewer-from-name">${m.from.name || m.from.address}</div>
            <div class="viewer-from-email">${m.from.address}</div>
          </div>
          <div class="viewer-date">${fmtDate(m.date)}</div>
        </div>
        <div class="viewer-recipients">
          ${m.to?.length ? `<div class="viewer-recipient-row"><span class="viewer-recipient-label">To</span><span class="viewer-recipient-value">${m.to.map(a => a.name ? `${a.name} &lt;${a.address}&gt;` : a.address).join(', ')}</span></div>` : ''}
          ${m.cc?.length ? `<div class="viewer-recipient-row"><span class="viewer-recipient-label">CC</span><span class="viewer-recipient-value">${m.cc.map(a => a.name ? `${a.name} &lt;${a.address}&gt;` : a.address).join(', ')}</span></div>` : ''}
          ${m.bcc?.length ? `<div class="viewer-recipient-row"><span class="viewer-recipient-label">BCC</span><span class="viewer-recipient-value">${m.bcc.map(a => a.name ? `${a.name} &lt;${a.address}&gt;` : a.address).join(', ')}</span></div>` : ''}
        </div>
      </div>
      <div class="email-body-area">
        ${m.htmlBody
          ? `<iframe id="email-iframe" sandbox="allow-same-origin" srcdoc="${m.htmlBody.replace(/"/g, '&quot;')}"></iframe>`
          : `<div class="email-body-text">${m.textBody || '(empty)'}</div>`
        }
      </div>
    `;
  }

  function attachIframeResize() {
    const iframe = document.getElementById('email-iframe');
    if (iframe) {
      iframe.onload = () => {
        try { iframe.style.height = iframe.contentDocument.body.scrollHeight + 'px'; } catch {}
      };
    }
  }

  function renderViewer() {
    const el = document.getElementById('email-viewer');
    if (!selectedEmail) {
      el.innerHTML = `<div class="empty-state" style="height:100%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><span>Select an email to read</span></div>`;
      return;
    }

    const m = selectedEmail;

    if (!replyMode) {
      el.innerHTML = `

  function renderTemplateFields() {

  function applyFormat(id, format) {
    const ta = document.getElementById(id);
    if (!ta) return;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const selected = ta.value.substring(start, end);
    if (!selected) return;

    let wrapped;
    if (format === 'bullet' || format === 'numbered') {
      const tag = format === 'bullet' ? 'ul' : 'ol';
      const items = selected.split('\n').map(line => `  <li style="margin:0 0 2px 0;padding:0;color:#555555;font-size:15px;line-height:1.5;">${line.trim()}</li>`).join('\n');
      wrapped = `<${tag} style="margin:4px 0 8px 0;padding-left:20px;color:#555555;font-size:15px;line-height:1.5;">\n${items}\n</${tag}>`;
    } else {
      const tags = { bold: ['<strong>', '</strong>'], italic: ['<em>', '</em>'] };
      const [open, close] = tags[format];
      wrapped = open + selected + close;
    }

    ta.value = ta.value.substring(0, start) + wrapped + ta.value.substring(end);
    ta.selectionStart = start;
    ta.selectionEnd = start + wrapped.length;
    ta.focus();
  }

  function updateTplSubject() {
    // Keep subject in sync if user hasn't manually edited it
    const m = selectedEmail;
    const tpl = TEMPLATES[selectedTemplate];
    if (tpl) {
      const subjectEl = document.getElementById('reply-subject');
      if (subjectEl) subjectEl.value = tpl.subject(m);
    }
  }

  async function sendReply() {
    const to = document.getElementById('reply-to').value.trim();
    const subject = document.getElementById('reply-subject').value.trim();

    if (!to) { showToast('Recipient is empty', 'error'); return; }

    let payload;

    if (replyComposerMode === 'basic') {
      const body = document.getElementById('reply-body')?.value || '';
      if (!body.trim()) { showToast('Message is empty', 'error'); return; }
      const html = `<div style="font-family:Arial,sans-serif;font-size:15px;line-height:1.75;color:#333;">${body.split('\n').map(l => l ? `<p style="margin:0 0 10px 0;">${l}</p>` : '<p style="margin:0 0 10px 0;">&nbsp;</p>').join('')}</div>`;
      payload = { to, subject, html, inReplyTo: selectedEmail.messageId, references: selectedEmail.messageId };
    } else {
      const tpl = TEMPLATES[selectedTemplate];
      const fields = {};
      (tpl?.fields || []).forEach(f => {
        fields[f.key] = document.getElementById(`tpl-${f.key}`)?.value || '';
      });
      payload = { to, subject, templateKey: selectedTemplate, fields, inReplyTo: selectedEmail.messageId, references: selectedEmail.messageId };
    }

    const btn = document.getElementById('preview-send-btn') || document.getElementById('send-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }

    api('/api/reply', { method: 'POST', body: JSON.stringify(payload) }).catch(() => {});
    setTimeout(() => {
      if (btn) { btn.disabled = false; btn.innerHTML = sendIcon(); }
      closePreview();
      showToast('Reply sent!', 'success');
      replyMode = false;
      renderViewer();
    }, 2000);
  }

  function sendIcon() {
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Send Reply`;
  }

  // ── Preview ────────────────────────────────────────────────────────────────

  async function previewTemplate() {
    const tpl = TEMPLATES[selectedTemplate];
    if (!tpl) return;
    const fields = {};
    (tpl.fields || []).forEach(f => {
      fields[f.key] = document.getElementById(`tpl-${f.key}`)?.value || '';
    });

    try {
      const res = await api('/api/preview', {
        method: 'POST',
        body: JSON.stringify({ templateKey: selectedTemplate, fields }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message);

      const iframe = document.getElementById('preview-iframe');
      iframe.srcdoc = data.html;
      iframe.onload = () => {
        try { iframe.style.height = iframe.contentDocument.body.scrollHeight + 'px'; } catch {}
      };
      document.getElementById('preview-overlay').classList.add('open');
    } catch (err) {
      showToast(err.message || 'Failed to load preview', 'error');
    }
  }

  function closePreview(e) {
    if (!e || e.target === document.getElementById('preview-overlay')) {
      document.getElementById('preview-overlay').classList.remove('open');

  }

      desc: 'Initiate a refund for a completed order',
      fields: [
        { key: 'refundNo',       type: 'String',  required: true,  default: () => 'REF' + Date.now() },
        { key: 'orderNo',        type: 'String',  required: true,  default: () => '' },
        { key: 'thirdOrderNo',   type: 'String',  required: true,  default: () => '' },
        { key: 'refundAmount',   type: 'String',  required: true,  default: () => '10.00' },
        { key: 'refundReason',   type: 'String',  required: false, default: () => 'Customer request' },
        { key: 'refundNotifyUrl',type: 'String',  required: false, default: () => 'https://example.com/refund-notify' },
      ],
    },
    {
      id: 'order-complete',
      name: 'Order Complete',
      method: 'POST',
      path: '/complete',
      desc: 'Notify third party upon completion of beverage preparation',
      fields: [
        { key: 'orderNo',        type: 'String',  required: true,  default: () => '' },
        { key: 'thirdOrderNo',   type: 'String',  required: true,  default: () => '' },
        { key: 'success',        type: 'Boolean', required: true,  default: () => 'true' },
        { key: 'orderStatus',    type: 'String',  required: true,  default: () => '2' },
        { key: 'outStockStatus', type: 'String',  required: true,  default: () => '2' },
        { key: 'outStockTime',   type: 'String',  required: false, default: () => new Date().toISOString().replace('T', ' ').slice(0, 19) },
      ],
    },
    {
      id: 'order-cancel',
      name: 'Order Cancel',
      method: 'POST',
      path: '/cancel',
      desc: 'Notify third party upon cancellation of payment',
      fields: [
        { key: 'orderNo',      type: 'String',  required: true,  default: () => '' },
        { key: 'thirdOrderNo', type: 'String',  required: true,  default: () => '' },
        { key: 'orderStatus',  type: 'String',  required: true,  default: () => '0' },
        { key: 'remark',       type: 'String',  required: false, default: () => 'Customer cancelled' },
        { key: 'cancelTime',   type: 'String',  required: true,  default: () => new Date().toISOString().replace('T', ' ').slice(0, 19) },
      ],
    },
  ];

  let activeEndpointId = null;
  let tunnelUrl = null;
  const epResponses = {};
  const actionResponses = {};

  async function loadTunnelUrl() {
    try {
      const res = await api('/api/tunnel-url');
      const data = await res.json();
      tunnelUrl = data.url || null;
    } catch {
      tunnelUrl = null;
    }
    renderTunnelBanner();
    if (activeEndpointId) renderEndpointDetail();
  }

  function renderTunnelBanner() {
    const el = document.getElementById('tunnel-banner');
    if (!el) return;
    if (tunnelUrl) {
      el.innerHTML = `
        <div class="tunnel-dot tunnel-dot-on"></div>
        <span class="tunnel-label">Public URL</span>
        <span class="tunnel-url" id="tunnel-url-text">${tunnelUrl}</span>
        <button class="tunnel-copy-btn" onclick="copyTunnelUrl()" title="Copy">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
      `;
    } else {
      el.innerHTML = `
        <div class="tunnel-dot tunnel-dot-off"></div>
        <span class="tunnel-label" style="color:var(--text-3)">No tunnel active</span>
        <span style="font-size:11px;color:var(--text-3)">— add <code style="background:var(--bg);padding:1px 5px;border-radius:4px;font-size:11px;">NGROK_AUTHTOKEN</code> to .env and restart</span>
        <button class="tunnel-copy-btn" onclick="loadTunnelUrl()" title="Refresh" style="margin-left:auto;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
      `;
    }
  }

  function copyTunnelUrl() {
    if (!tunnelUrl) return;
    navigator.clipboard.writeText(tunnelUrl).then(() => showToast('Tunnel URL copied!', 'success'));
  }

  function initMachinePanel() {
    const list = document.getElementById('endpoint-list');
    list.innerHTML = `
      <div class="endpoint-list-header">5 Endpoints</div>
      ${MACHINE_ENDPOINTS.map(ep => `
        <div class="endpoint-item ${activeEndpointId === ep.id ? 'ep-active' : ''}" onclick="selectEndpoint('${ep.id}')">
          <span class="method-badge method-post">${ep.method}</span>
          <div class="endpoint-path">/order${ep.path}</div>
          <div class="endpoint-desc">${ep.desc}</div>
        </div>
      `).join('')}
    `;
    if (activeEndpointId) renderEndpointDetail();
    loadTunnelUrl();
  }

  function selectEndpoint(id) {
    activeEndpointId = id;
    initMachinePanel();
    renderEndpointDetail();
  }

  function renderEndpointDetail() {
    const ep = MACHINE_ENDPOINTS.find(e => e.id === activeEndpointId);
    const el = document.getElementById('endpoint-detail');
    if (!ep) return;
    const resp = epResponses[ep.id];
    const localUrl = `http://localhost:${window.location.port || 4000}/order${ep.path}`;
    const publicUrl = tunnelUrl ? `${tunnelUrl}/order${ep.path}` : null;

    el.innerHTML = `
      <div class="endpoint-url-bar">
        <span class="url-method-badge">${ep.method}</span>
        <div style="flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;">
          <div class="url-path-display">${localUrl}</div>
          ${publicUrl ? `
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-size:10px;color:#22c55e;font-weight:700;flex-shrink:0;">PUBLIC</span>
              <div class="url-path-display" style="font-size:12px;color:#22c55e;border-color:rgba(34,197,94,.3);">${publicUrl}</div>
              <button class="tunnel-copy-btn" onclick="navigator.clipboard.writeText('${publicUrl}').then(()=>showToast('Copied!','success'))" title="Copy public URL">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              </button>
            </div>
          ` : ''}
        </div>
        <button class="send-endpoint-btn" id="send-ep-btn" onclick="sendEndpointRequest()">Send</button>
      </div>
      <div class="endpoint-sections">
        <div>
          <div class="ep-section-title">Request Body</div>
          <div class="field-grid">
            ${ep.fields.map(f => `
              <div class="field-row">
                <div class="field-label-wrap">
                  <span class="field-name">${f.key}</span>
                  <div class="field-badges">
                    <span class="field-badge ${f.required ? 'field-required' : 'field-optional'}">${f.required ? 'required' : 'optional'}</span>
                    <span class="field-type-tag">${f.type}</span>
                  </div>
                </div>
                <input class="field-input" id="ep-${f.key}" type="text" value="${f.default()}" placeholder="${f.key}" />
              </div>
            `).join('')}
          </div>
        </div>
        <div>
          <div class="ep-section-title">Response</div>
          <div class="response-area">
            <div class="response-header">
              <div class="response-status-dot ${resp ? (resp.ok ? 'dot-success' : 'dot-error') : 'dot-idle'}"></div>
              <span class="response-status-text">${resp ? (resp.ok ? `${resp.status} OK` : `${resp.status} Error`) : 'No request sent yet'}</span>
            </div>
            <div class="response-body">${resp
              ? JSON.stringify(resp.data, null, 2)
              : '<span class="response-placeholder">Hit Send to see the response...</span>'
            }</div>
          </div>
        </div>
        ${ep.id === 'order-create' ? renderQrSection(resp) : ''}
        ${ep.id === 'order-create' ? renderOrderActions() : ''}
      </div>
    `;
    initQrCode();
  }

  async function sendEndpointRequest() {
    const ep = MACHINE_ENDPOINTS.find(e => e.id === activeEndpointId);
    if (!ep) return;
    const btn = document.getElementById('send-ep-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }

    const body = {};
    ep.fields.forEach(f => {
      const val = (document.getElementById(`ep-${f.key}`) || {}).value || '';
      if (val !== '') {
        body[f.key] = f.type === 'Boolean' ? val === 'true' : val;
      }
    });

    try {
      const res = await fetch(`/order${ep.path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      epResponses[ep.id] = { ok: res.ok, status: res.status, data, req: body };
      if (ep.id === 'order-create') Object.keys(actionResponses).forEach(k => delete actionResponses[k]);
      showToast(res.ok ? 'Request successful' : `Error ${res.status}`, res.ok ? 'success' : 'error');
    } catch (err) {
      epResponses[ep.id] = { ok: false, status: 0, data: { error: err.message } };
      showToast('Request failed: ' + err.message, 'error');
    }

    renderEndpointDetail();
  }

  function renderQrSection(resp) {
    if (!resp?.ok || !resp.data?.data?.qrUrl) return '';
    return `
      <div>
        <div class="ep-section-title">QR Code</div>
        <div class="qr-section">
          <div class="qr-canvas-wrap" id="qr-canvas-wrap"></div>
          <div class="qr-url-label">${resp.data.data.qrUrl}</div>
        </div>
      </div>
    `;
  }

  function initQrCode() {
    if (activeEndpointId !== 'order-create') return;
    const resp = epResponses['order-create'];
    if (!resp?.ok || !resp.data?.data?.qrUrl) return;
    const wrap = document.getElementById('qr-canvas-wrap');
    if (!wrap || wrap.childElementCount > 0) return;
    new QRCode(wrap, { text: resp.data.data.qrUrl, width: 200, height: 200 });
  }

  function renderOrderActions() {
    const resp = epResponses['order-create'];
    if (!resp?.ok || !resp.data?.data) return '';
    const actions = [
      { key: 'status',   label: 'Check Status' },
      { key: 'complete', label: 'Complete' },
      { key: 'refund',   label: 'Refund' },
      { key: 'cancel',   label: 'Cancel' },
    ];
    return `
      <div>
        <div class="ep-section-title">Order Actions</div>
        <div class="action-buttons-row">
          ${actions.map(a => `<button class="action-btn" id="act-${a.key}-btn" onclick="doOrderAction('${a.key}')">${a.label}</button>`).join('')}
        </div>
        ${actions.filter(a => actionResponses[a.key]).map(a => `
          <div style="margin-top:12px;">
            <div class="ep-section-title">${a.label} Response</div>
            <div class="response-area">
              <div class="response-header">
                <div class="response-status-dot ${actionResponses[a.key] ? (actionResponses[a.key].ok ? 'dot-success' : 'dot-error') : 'dot-idle'}"></div>
                <span class="response-status-text">${actionResponses[a.key].ok ? actionResponses[a.key].status + ' OK' : actionResponses[a.key].status + ' Error'}</span>
              </div>
              <div class="response-body">${JSON.stringify(actionResponses[a.key].data, null, 2)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  async function doOrderAction(action) {
    const resp = epResponses['order-create'];
    if (!resp?.data?.data) return;
    const d = resp.data.data;
    const orderNo = resp.req?.orderNo || '';
    const now = new Date().toISOString().replace('T', ' ').slice(0, 19);

    let path, body;
    if (action === 'status') {
      path = '/order/status';
      body = { orderNo, thirdOrderNo: d.thirdOrderNo };
    } else if (action === 'complete') {
      path = '/order/complete';
      body = { orderNo, thirdOrderNo: d.thirdOrderNo, success: true, orderStatus: '2', outStockStatus: '2', outStockTime: now };
    } else if (action === 'refund') {
      path = '/order/refund';
      body = { refundNo: 'REF' + Date.now(), orderNo, thirdOrderNo: d.thirdOrderNo, refundAmount: resp.req?.totalAmount || '10.00' };
    } else if (action === 'cancel') {
      path = '/order/cancel';
      body = { orderNo, thirdOrderNo: d.thirdOrderNo, orderStatus: '0', cancelTime: now };
    }

    const btn = document.getElementById(`act-${action}-btn`);
    if (btn) { btn.disabled = true; btn.textContent = '...'; }

    try {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      actionResponses[action] = { ok: res.ok, status: res.status, data };
      showToast(res.ok ? `${action} successful` : `${action} failed`, res.ok ? 'success' : 'error');
    } catch (err) {
      actionResponses[action] = { ok: false, status: 0, data: { error: err.message } };
      showToast(`${action} failed: ` + err.message, 'error');
    }

    renderEndpointDetail();
  }
</script>
</body>
</html>
